<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="344" viewBox="0 0 1000 344" role="img" aria-labelledby="title desc">
<title id="title">From a name to an evaluation</title><desc id="desc">An excerpt from the name map next to the original SWE-bench protocol.</desc>
<style>
svg{--paper:#f4f7ef;--ink:#163b32;--quiet:#47655c;--line:#c1cec3;--cell:#f0f2ef;--mint:#b4e6cc;--deep:#185e49;--panel:#123c32;--cream:#f7f8e8;--tag:#b5dac9;--bar:#66ae8d;--accent:#185e49}
@media(prefers-color-scheme:dark){svg{--paper:#1d302a;--ink:#edf5e9;--quiet:#c0d2c4;--line:#567166;--cell:#34403c;--mint:#376d56;--deep:#174637;--panel:#0e241e;--bar:#77c5a1;--accent:#b6f0c9}}
text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:var(--ink)}
.serif{font-family:Georgia,"Songti SC","Noto Serif CJK SC",serif}.quiet{fill:var(--quiet)}.cream{fill:var(--cream)}.tag{fill:var(--tag)}
</style>
<rect x="0.75" y="0.75" width="998.5" height="342.5" rx="14" fill="var(--paper)" stroke="var(--line)"/>
<text x="28" y="36" font-size="14" class="quiet" font-weight="700" text-anchor="start" letter-spacing="1.3">01   /   NAME MAP</text>
<text x="28" y="88" font-size="43" class="serif" font-weight="500" text-anchor="start" letter-spacing="0">Is the name taken?</text>
<text x="184.0" y="131" font-size="18" class="quiet" font-weight="600" text-anchor="middle" letter-spacing="0">Bench</text>
<text x="326.0" y="131" font-size="18" class="quiet" font-weight="600" text-anchor="middle" letter-spacing="0">Eval</text>
<text x="468.0" y="131" font-size="18" class="quiet" font-weight="600" text-anchor="middle" letter-spacing="0">Dojo</text>
<text x="102" y="164.5" font-size="17" class="quiet" font-weight="600" text-anchor="end" letter-spacing="0">SWE</text>
<g data-cell="SWE|Bench" data-state="deep">
<rect x="113" y="139" width="137" height="40" rx="4" fill="var(--deep)" stroke="var(--line)"/>
<text x="122" y="164.5" font-size="15" class="cream" font-weight="600" text-anchor="start" letter-spacing="0">◆</text>
<text x="186.5" y="164.5" font-size="17" class="cream" font-weight="600" text-anchor="middle" letter-spacing="0">SWE-bench</text>
</g>
<g data-cell="SWE|Eval" data-state="mint">
<rect x="255" y="139" width="137" height="40" rx="4" fill="var(--mint)" stroke="var(--line)"/>
<text x="264" y="164.5" font-size="15" class="quiet" font-weight="600" text-anchor="start" letter-spacing="0">•</text>
<text x="328.5" y="164.5" font-size="17" class="" font-weight="600" text-anchor="middle" letter-spacing="0">SWE-eval</text>
</g>
<g data-cell="SWE|Dojo" data-state="cell">
<rect x="397" y="139" width="137" height="40" rx="4" fill="var(--cell)" stroke="var(--line)"/>
<text x="406" y="164.5" font-size="15" class="quiet" font-weight="600" text-anchor="start" letter-spacing="0">–</text>
<text x="470.5" y="164.5" font-size="17" class="" font-weight="600" text-anchor="middle" letter-spacing="0">SWE-Dojo</text>
</g>
<text x="102" y="209.5" font-size="17" class="quiet" font-weight="600" text-anchor="end" letter-spacing="0">Agent</text>
<g data-cell="Agent|Bench" data-state="mint">
<rect x="113" y="184" width="137" height="40" rx="4" fill="var(--mint)" stroke="var(--line)"/>
<text x="122" y="209.5" font-size="15" class="quiet" font-weight="600" text-anchor="start" letter-spacing="0">•</text>
<text x="186.5" y="209.5" font-size="17" class="" font-weight="600" text-anchor="middle" letter-spacing="0">AgentBench</text>
</g>
<g data-cell="Agent|Eval" data-state="mint">
<rect x="255" y="184" width="137" height="40" rx="4" fill="var(--mint)" stroke="var(--line)"/>
<text x="264" y="209.5" font-size="15" class="quiet" font-weight="600" text-anchor="start" letter-spacing="0">•</text>
<text x="328.5" y="209.5" font-size="17" class="" font-weight="600" text-anchor="middle" letter-spacing="0">AgentEval</text>
</g>
<g data-cell="Agent|Dojo" data-state="mint">
<rect x="397" y="184" width="137" height="40" rx="4" fill="var(--mint)" stroke="var(--line)"/>
<text x="406" y="209.5" font-size="15" class="quiet" font-weight="600" text-anchor="start" letter-spacing="0">•</text>
<text x="470.5" y="209.5" font-size="17" class="" font-weight="600" text-anchor="middle" letter-spacing="0">AgentDojo</text>
</g>
<text x="102" y="254.5" font-size="17" class="quiet" font-weight="600" text-anchor="end" letter-spacing="0">Robo</text>
<g data-cell="Robo|Bench" data-state="mint">
<rect x="113" y="229" width="137" height="40" rx="4" fill="var(--mint)" stroke="var(--line)"/>
<text x="122" y="254.5" font-size="15" class="quiet" font-weight="600" text-anchor="start" letter-spacing="0">•</text>
<text x="186.5" y="254.5" font-size="17" class="" font-weight="600" text-anchor="middle" letter-spacing="0">RoboBench</text>
</g>
<g data-cell="Robo|Eval" data-state="mint">
<rect x="255" y="229" width="137" height="40" rx="4" fill="var(--mint)" stroke="var(--line)"/>
<text x="264" y="254.5" font-size="15" class="quiet" font-weight="600" text-anchor="start" letter-spacing="0">•</text>
<text x="328.5" y="254.5" font-size="17" class="" font-weight="600" text-anchor="middle" letter-spacing="0">RoboEval</text>
</g>
<g data-cell="Robo|Dojo" data-state="deep">
<rect x="397" y="229" width="137" height="40" rx="4" fill="var(--deep)" stroke="var(--line)"/>
<text x="406" y="254.5" font-size="15" class="cream" font-weight="600" text-anchor="start" letter-spacing="0">◆</text>
<text x="470.5" y="254.5" font-size="17" class="cream" font-weight="600" text-anchor="middle" letter-spacing="0">RoboDojo</text>
</g>
<text x="28" y="313" font-size="17" class="quiet" font-weight="600" text-anchor="start" letter-spacing="0">◆  In a report</text>
<text x="195" y="313" font-size="17" class="quiet" font-weight="600" text-anchor="start" letter-spacing="0">•  Evaluation</text>
<text x="362" y="313" font-size="17" class="quiet" font-weight="600" text-anchor="start" letter-spacing="0">–  No match</text>
<rect x="567" y="12" width="421" height="320" rx="10" fill="var(--panel)"/>
<text x="594" y="45" font-size="14" class="tag" font-weight="700" text-anchor="start" letter-spacing="1.3">02   /   ORIGINAL EDITION</text>
<text x="592" y="105" font-size="50" class="serif cream" font-weight="400" text-anchor="start" letter-spacing="0">SWE-bench</text>
<path d="M594,125 L961,125" stroke="var(--quiet)"/>
<text x="594" y="150" font-size="12" class="tag" font-weight="700" text-anchor="start" letter-spacing="1.2">INPUT</text>
<text x="594" y="175" font-size="21" class="cream" font-weight="500" text-anchor="start" letter-spacing="0">Repository snapshot + GitHub issue</text>
<text x="594" y="209" font-size="12" class="tag" font-weight="700" text-anchor="start" letter-spacing="1.2">OUTPUT</text>
<text x="594" y="234" font-size="21" class="cream" font-weight="500" text-anchor="start" letter-spacing="0">A patch to the repository</text>
<text x="594" y="268" font-size="12" class="tag" font-weight="700" text-anchor="start" letter-spacing="1.2">SCORING</text>
<text x="594" y="293" font-size="21" class="cream" font-weight="500" text-anchor="start" letter-spacing="0">Issue-fixing + regression tests</text>
</svg>
